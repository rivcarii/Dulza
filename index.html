<script>
/* Aplica el tema guardado antes del primer pintado (evita el destello claro/oscuro) */
(function(){try{var t=JSON.parse(localStorage.getItem('dz-theme')||'null'),r=document.documentElement;
if(t){var s=t.mode==='auto'||!t.mode?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t.mode;r.dataset.theme=s;
for(var k in t.vars)r.style.setProperty(k,t.vars[k]);var m=document.querySelector('meta[name=theme-color]');if(m&&t.bg)m.setAttribute('content',t.bg);}
else if(matchMedia('(prefers-color-scheme: dark)').matches){r.dataset.theme='dark';}}catch(e){}})();
</script>
